server {
    listen 80;
    server_name dealspark.in www.dealspark.in;

    # Maximum upload size for product images
    client_max_body_size 16M;

    # Serve static assets directly through Nginx for peak performance
    location /static/ {
        alias /var/www/dealspark/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Proxy all application requests to Gunicorn WSGI server
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
