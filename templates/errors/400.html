{% extends "base.html" %}

{% block title %}400 - Bad Request — DealSpark{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="d-inline-flex p-4 rounded-circle bg-secondary bg-opacity-10 text-secondary mb-4">
      <i class="bi bi-slash-circle fs-1"></i>
    </div>
    <h1 class="display-5 fw-bold mb-2">Invalid Request (400)</h1>
    <p class="text-muted lead max-w-500 mx-auto mb-4" style="max-width: 500px;">
      The request could not be processed due to invalid parameters or an expired security session.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary-ds">
      <i class="bi bi-house me-1"></i> Return to Homepage
    </a>
  </div>
</div>
{% endblock %}
