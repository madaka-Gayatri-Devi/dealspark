{% extends "base.html" %}

{% block title %}404 - Page Not Found — DealSpark{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="d-inline-flex p-4 rounded-circle bg-danger bg-opacity-10 text-danger mb-4">
      <i class="bi bi-exclamation-triangle fs-1"></i>
    </div>
    <h1 class="display-5 fw-bold mb-2">Deal Not Found (404)</h1>
    <p class="text-muted lead max-w-500 mx-auto mb-4" style="max-width: 500px;">
      The deal, category, or page you are looking for might have expired, been removed, or is temporarily unavailable.
    </p>
    <div class="d-flex justify-content-center gap-3">
      <a href="{{ url_for('main.index') }}" class="btn btn-primary-ds">
        <i class="bi bi-house me-1"></i> Return to Deals
      </a>
      <a href="{{ url_for('main.search') }}" class="btn btn-outline-ds">
        <i class="bi bi-search me-1"></i> Search Other Deals
      </a>
    </div>
  </div>
</div>
{% endblock %}
