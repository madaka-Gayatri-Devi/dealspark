{% extends "base.html" %}

{% block title %}403 - Access Forbidden — DealSpark{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="d-inline-flex p-4 rounded-circle bg-warning bg-opacity-10 text-warning mb-4">
      <i class="bi bi-shield-lock-fill fs-1"></i>
    </div>
    <h1 class="display-5 fw-bold mb-2">Access Denied (403)</h1>
    <p class="text-muted lead max-w-500 mx-auto mb-4" style="max-width: 500px;">
      You do not have administrative permission to view this section. Role-based authentication is strictly enforced.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary-ds">
      <i class="bi bi-house me-1"></i> Return to Homepage
    </a>
  </div>
</div>
{% endblock %}
